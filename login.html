<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Need Me Store — دخول</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0f0f13;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:#1a1a24;border:1px solid #2a2a3a;border-radius:16px;padding:40px;width:360px;text-align:center}
.logo{font-size:3rem;margin-bottom:12px}
h2{color:#e8e8f0;font-size:1.2rem;font-weight:700;margin-bottom:4px}
.sub{color:#6b6b85;font-size:.8rem;margin-bottom:28px}
input{width:100%;padding:11px 14px;border-radius:8px;border:1px solid #2a2a3a;background:#22222f;color:#e8e8f0;font-size:.9rem;margin-bottom:14px;outline:none;font-family:'Inter',sans-serif;text-align:center}
input:focus{border-color:#7c5cfc}
button{width:100%;padding:12px;background:#7c5cfc;color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .15s}
button:hover{background:#5b4bd4}
.error{color:#ef4444;font-size:.8rem;margin-bottom:12px;background:#450a0a;padding:8px 12px;border-radius:6px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">🌙</div>
  <h2>Need Me Store</h2>
  <p class="sub">Admin Dashboard</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="POST">
    <input type="password" name="password" placeholder="كلمة السر" autofocus>
    <button type="submit">دخول ←</button>
  </form>
</div>
</body></html>
