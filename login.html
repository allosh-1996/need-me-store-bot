<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Allosh — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:#0a0000;
  overflow:hidden;
  position:relative;
}

/* خلفية حمراء داكنة */
.bg{
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 50% 0%, #3a0000 0%, transparent 60%),
    radial-gradient(ellipse at 50% 100%, #1a0000 0%, transparent 60%),
    radial-gradient(ellipse at 0% 50%, #200000 0%, transparent 50%),
    radial-gradient(ellipse at 100% 50%, #250000 0%, transparent 50%),
    #080000;
  z-index:0;
}

/* كلمات الأركان */
.corner-word{
  position:fixed;
  font-size:1rem;
  font-weight:700;
  letter-spacing:.25em;
  color:rgba(255,255,255,.12);
  z-index:1;
}
.corner-word.top-left{top:40px;left:30px}
.corner-word.bottom-left{bottom:40px;left:30px}
.corner-word.bottom-right{bottom:40px;right:30px}

/* Allosh watermark */
.watermark{
  position:fixed;
  font-family:'Dancing Script',cursive;
  font-size:120px;
  color:rgba(255,255,255,.06);
  z-index:1;
  bottom:-10px;right:-20px;
  user-select:none;
  pointer-events:none;
  white-space:nowrap;
}

/* البوكس */
.box{
  position:relative;z-index:2;
  background:rgba(20,0,0,.75);
  border:1px solid rgba(180,0,0,.25);
  border-radius:20px;
  padding:44px 36px;
  width:340px;max-width:92vw;
  text-align:center;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

/* Allosh في البوكس */
.box-logo{
  font-family:'Dancing Script',cursive;
  font-size:3.2rem;
  line-height:1;
  margin-bottom:6px;
}
.box-logo .a{color:#cc1111}
.box-logo .rest{color:#fff}

/* watermark داخل البوكس */
.box-watermark{
  font-family:'Dancing Script',cursive;
  font-size:5rem;
  color:rgba(255,255,255,.05);
  position:absolute;
  bottom:10px;left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  pointer-events:none;
  user-select:none;
}

.tagline{
  font-size:.65rem;
  letter-spacing:.2em;
  color:rgba(255,255,255,.35);
  margin-bottom:28px;
}

/* Labels */
.field-label{
  display:flex;align-items:center;gap:6px;
  font-size:.78rem;font-weight:600;
  color:rgba(255,255,255,.7);
  margin-bottom:6px;text-align:left;
}

/* Inputs */
input{
  width:100%;
  padding:12px 16px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;
  color:#fff;
  font-size:.88rem;
  font-family:'Inter',sans-serif;
  outline:none;
  margin-bottom:16px;
  transition:border .2s;
}
input::placeholder{color:rgba(255,255,255,.25)}
input:focus{border-color:rgba(180,0,0,.6)}

/* زر الدخول */
.login-btn{
  width:100%;
  padding:14px;
  background:linear-gradient(135deg,#8b0000,#cc1111);
  border:none;border-radius:10px;
  color:#fff;font-size:.9rem;font-weight:600;
  cursor:pointer;
  letter-spacing:.05em;
  transition:all .2s;
  margin-top:4px;
}
.login-btn:hover{background:linear-gradient(135deg,#a00000,#dd2222);transform:translateY(-1px)}
.login-btn:active{transform:translateY(0)}

.error{
  color:#ff6b6b;font-size:.78rem;
  background:rgba(180,0,0,.2);
  border:1px solid rgba(180,0,0,.3);
  border-radius:8px;padding:8px 12px;
  margin-bottom:14px;
}
</style>
</head>
<body>

<div class="bg"></div>

<!-- كلمات الأركان -->
<div class="corner-word top-left">TRACK</div>
<div class="corner-word bottom-left">EARN</div>
<div class="corner-word bottom-right">WIN</div>

<!-- Watermark -->
<div class="watermark">Allosh</div>

<div class="box">
  <div class="box-watermark">Allosh</div>

  <div class="box-logo">
    <span class="a">A</span><span class="rest">llosh</span>
  </div>
  <div class="tagline">TRACK &nbsp;·&nbsp; EARN &nbsp;·&nbsp; WIN</div>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="POST">
    <div class="field-label">🔑 Password</div>
    <input type="password" name="password" placeholder="Password" autofocus>
    <button type="submit" class="login-btn">• • •</button>
  </form>
</div>

</body>
</html>
